# Main Properties & Buttons
ResetTracking="Reset Tracking"
ResetTracking.Desc="Resets the tracking state, framing crop, and smoothing filters back to initial settings."

# Presets
Preset="Preset"
Preset.Desc="Select or manage saved tracking and camera presets."
LoadPreset="Load Preset"
LoadPreset.Desc="Loads the selected preset settings into the current filter/source."
SavePreset="Save Preset"
SavePreset.Desc="Saves the current parameters under the chosen preset name."
DeletePreset="Delete Preset"
DeletePreset.Desc="Removes the selected preset from configuration."
SaveTrackingParams="Save/Load Tracking Parameters"
SaveTrackingParams.Desc="Includes zoom, face position, and framing margins in the preset."
SaveControlParams="Save/Load Movement Parameters"
SaveControlParams.Desc="Includes smoothing, speed, and responsiveness settings in the preset."

# Face Framing & Target Location
TrackingTarget="Face Framing & Position"
Zoom="Zoom Level / Face Size"
Zoom.Desc="Controls the target size of the face in relation to the screen. 1.0 fills the screen; smaller values provide a wider, more natural camera shot."
PosX="Horizontal Offset (X)"
PosX.Desc="Horizontal alignment of the face. 0.0 is center; negative shifts left; positive shifts right."
PosY="Vertical Offset (Y)"
PosY.Desc="Vertical alignment of the face. 0.0 is center; negative shifts up (ideal for following the Rule of Thirds); positive shifts down."
ScaleMax="Max Zoom Limit"
ScaleMax.Desc="Prevents excessive digital zoom when the subject moves far away, preserving video resolution."

# Framing Margins (Upsize)
UpsizeLeft="Left Margin"
UpsizeLeft.Desc="Extra horizontal margin on the left of the head."
UpsizeRight="Right Margin"
UpsizeRight.Desc="Extra horizontal margin on the right of the head."
UpsizeTop="Headroom (Top Margin)"
UpsizeTop.Desc="Extra vertical space above the head to avoid cutting off hair or hats."
UpsizeBottom="Bottom Margin (Torso/Neck)"
UpsizeBottom.Desc="Extra vertical space below the chin for shoulders and upper torso framing."

# Movement & Response (PID and Smoothing)
TrackingResponse="Movement & Responsiveness"
Profile="Movement Profile"
Profile.Desc="Choose how smoothly the camera follows head movements."
Profile.Smooth="Cinematic / Smooth (Slow & gentle tracking, ideal for talk shows)"
Profile.Balanced="Balanced (Default, natural movement for streamers)"
Profile.Fast="Dynamic / Fast (Quick response, great for active presentations)"
Profile.Custom="Manual / Advanced (Fine-tune PID parameters)"

TrackKp="Responsiveness Speed (Kp)"
TrackKp.Desc="Higher values make the camera react faster to movement. Too high may cause overshoot."
TrackKi="Centering Correction (Ki)"
TrackKi.Desc="Integral term. Helps eliminate static offset and centers the face over time."
TrackTd="Movement Damping (Td)"
TrackTd.Desc="Derivative term. Dampens sudden movements to prevent erratic camera jerks."
TrackLPF="Noise Filter (LPF)"
TrackLPF.Desc="Low-pass filter for movement damping. Higher values reduce jitter from sensor noise."
TrackLPFZ="Zoom Noise Filter (LPF Z)"
TrackLPFZ.Desc="Low-pass filter for zoom smoothing. Prevents rapid zoom pulses."
ZoomAttenuation="Zoom Dampening"
ZoomAttenuation.Desc="Attenuates zoom adjustments to keep zoom transitions smoother than panning."
Deadband="Anti-Jitter Deadband (X, Y, Z)"
Deadband.Desc="Threshold to ignore micro-movements (breathing, slight posture shifts). Keeps camera completely still when sitting quietly."
NonlinearBand="Smooth Acceleration Band (X, Y, Z)"
NonlinearBand.Desc="Provides a smooth transition out of the deadband, avoiding abrupt starts."

# Face Detection Options
FaceDetectionOptions="Face Detection Engine"
ScaleImage="Detector Downscale Factor"
ScaleImage.Desc="Scales the image down before face detection to save CPU/GPU. Set to 1 for 4K/small faces, 2 for 1080p, or higher for low CPU usage."
DetectorEngine="Detection Engine"
DetectorEngine.Desc="Select detection algorithm. HOG is lightweight on CPU. CNN provides high accuracy but requires GPU acceleration to avoid freezing."
DlibHogModel="Dlib HOG Model File"
DlibHogModel.Desc="Path to the frontal face detector model file (.dat)."
DlibCnnModel="Dlib CNN Model File"
DlibCnnModel.Desc="Path to the MMOD CNN face detector model file (.dat). Note: Without CUDA acceleration, this will be very slow."
CropLeft="Detector Search Area - Left"
CropLeft.Desc="Ignore left side of the frame during face detection (useful to exclude background people)."
CropRight="Detector Search Area - Right"
CropRight.Desc="Ignore right side of the frame during face detection."
CropTop="Detector Search Area - Top"
CropTop.Desc="Ignore top area of the frame during face detection."
CropBottom="Detector Search Area - Bottom"
CropBottom.Desc="Ignore bottom area of the frame during face detection."
LandmarkDetection="Enable Facial Landmarks"
LandmarkDetection.Desc="Detects detailed facial features (eyes, nose, mouth) for more accurate centering."
LandmarkData="Landmark Dataset File"
LandmarkData.Desc="Path to the shape predictor model (e.g. 5-point landmark file)."
TrackingThEn="Enable Tracking Confidence Threshold"
TrackingThEn.Desc="Stops tracking if correlation confidence drops below the threshold."
TrackingThDb="Lost Target Threshold (dB)"
TrackingThDb.Desc="Sensitivity threshold to declare the face lost and re-trigger detection."

# Output & Input
Output="Output Framing"
Aspect="Aspect Ratio"
Aspect.Desc="Desired output aspect ratio. Leave as 'same as source' or choose portrait/landscape."
SameAsSource="Same as source"
Source="Video Source"
Source.Desc="Select the input source texture to apply face tracking to."

# Automation & Debug
Automation="Automation"
InactiveReset="Reset when inactive"
InactiveReset.Desc="Resets framing and pauses tracking when this source is not visible on program output."
Debugging="Diagnostics & Debugging"
DebugFaces="Show Face Bounding Boxes"
DebugFaces.Desc="Draws blue/green boxes around detected and tracked faces (automatically hidden in program output)."
DebugNoTrack="Freeze Tracking (Preview Mode)"
DebugNoTrack.Desc="Shows the full original camera feed with a yellow box indicating the crop area."
DebugAlwaysShow="Always Show Debug Overlays"
DebugAlwaysShow.Desc="Keeps debug boxes visible even when live on program (useful for demos)."

# Face Tracker PTZ Specific Settings
PtzSmoothness="PTZ Acceleration Smoothness (Ramp)"
PtzSmoothness.Desc="Controls the mechanical acceleration/deceleration ramping of the physical camera motors. Lower values produce silky broadcast-style moves, higher values are more snappy."
TrackKpX="Track Kp Pan (Horizontal)"
TrackKpY="Track Kp Tilt (Vertical)"
TrackKpZ="Track Kp Zoom"
TrackKiX="Track Ki Pan"
TrackKiY="Track Ki Tilt"
TrackKiZ="Track Ki Zoom"
TrackTdX="Track Td Pan"
TrackTdY="Track Td Tilt"
TrackTdZ="Track Td Zoom"
TrackLPFXY="LPF Filter for Td (Pan/Tilt)"
DeadbandX="Deadband Pan (%)"
DeadbandY="Deadband Tilt (%)"
DeadbandZ="Deadband Zoom (%)"
NonlinearBandX="Nonlinear Band Pan (%)"
NonlinearBandY="Nonlinear Band Tilt (%)"
NonlinearBandZ="Nonlinear Band Zoom (%)"
AttenuationTime="Lost Face Velocity Attenuation Time"
AttenuationTime.Desc="Time in seconds to gently coast camera speed down to zero if the subject leaves the scene."

# Gamepad (Xbox / PS5)
Gamepad.Group="Gamepad Control (Xbox / PS5)"
Gamepad.Enabled="Enable Gamepad Control"
Gamepad.Enabled.Desc="Control camera Pan, Tilt and Zoom in real-time using the thumbsticks and triggers of an Xbox, PS5 or USB/Bluetooth controller."
Gamepad.Deadzone="Thumbstick Deadzone (%)"
Gamepad.Deadzone.Desc="Ignores small resting stick offsets to prevent camera drift when you are not touching the stick."
Gamepad.Sensitivity="Thumbstick Sensitivity"
Gamepad.Sensitivity.Desc="Speed multiplier for analog stick control with exponential response curve."

# Face Lost Behavior
FaceLost.Group="Face Lost Behavior"
FaceLost.TimeoutPreset="Timeout before Recalling Preset"
FaceLost.TimeoutPreset.Desc="Seconds to wait before automatically recalling a home preset when the subject leaves frame."
FaceLost.PresetIndex="Home Preset Index (-1 to disable)"
FaceLost.PresetIndex.Desc="Camera hardware preset index to recall when face is lost (e.g. 1 for wide shot)."
FaceLost.TimeoutZoomout="Timeout before Zoom-Out"
FaceLost.TimeoutZoomout.Desc="Automatically zooms out to wide angle after this time to help find the subject."

# PTZ Connection
PTZ.Type="PTZ Camera Type"
PTZ.Type.Desc="Select the communication method with your PTZ camera."
PTZ.Type.None="None (Simulation / Test)"
PTZ.Type.Obsptz="Through PTZ Controls Plugin (obs-ptz)"
PTZ.Type.ViscaTCP="VISCA over IP (TCP)"
PTZ.InvertPan="Invert Pan (Horizontal)"
PTZ.InvertPan.Desc="Inverts the horizontal camera panning direction."
PTZ.InvertTilt="Invert Tilt (Vertical)"
PTZ.InvertTilt.Desc="Inverts the vertical camera tilting direction."
PTZ.InvertZoom="Invert Zoom"
PTZ.InvertZoom.Desc="Inverts zoom in and zoom out directions."

