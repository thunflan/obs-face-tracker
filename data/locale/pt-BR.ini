# Propriedades Principais & Botões
ResetTracking="Resetar Rastreamento"
ResetTracking.Desc="Restaura o estado inicial de enquadramento, zera o recorte e limpa os filtros de suavização."

# Predefinições (Presets)
Preset="Predefinição"
Preset.Desc="Selecione ou gerencie predefinições salvas de enquadramento e câmera."
LoadPreset="Carregar Predefinição"
LoadPreset.Desc="Aplica as configurações da predefinição selecionada ao filtro/fonte atual."
SavePreset="Salvar Predefinição"
SavePreset.Desc="Salva os parâmetros atuais sob o nome de predefinição digitado."
DeletePreset="Excluir Predefinição"
DeletePreset.Desc="Remove a predefinição selecionada da configuração."
SaveTrackingParams="Salvar/Carregar Posição e Enquadramento"
SaveTrackingParams.Desc="Salva e restaura zoom, alinhamento facial e margens da cabeça."
SaveControlParams="Salvar/Carregar Dinâmica de Movimento"
SaveControlParams.Desc="Salva e restaura os parâmetros de suavidade, velocidade e resposta da câmera."

# Enquadramento e Posição do Alvo
TrackingTarget="Enquadramento e Posição do Rosto"
Zoom="Nível de Zoom / Tamanho do Rosto"
Zoom.Desc="Define o tamanho desejado do rosto em relação à tela. 1.0 preenche a tela inteira; valores menores (como 0.35 - 0.70) geram planos mais amplos e naturais."
PosX="Deslocamento Horizontal (X)"
PosX.Desc="Alinhamento horizontal do rosto. 0.0 é centralizado; valores negativos movem para a esquerda; positivos para a direita."
PosY="Deslocamento Vertical (Y)"
PosY.Desc="Alinhamento vertical do rosto. 0.0 é o centro; valores negativos posicionam o rosto mais no topo (ideal para a Regra dos Terços)."
ScaleMax="Limite Máximo de Zoom"
ScaleMax.Desc="Impede que o zoom digital aumente em excesso caso a pessoa se afaste muito, preservando a nitidez do vídeo."

# Margens ao Redor da Face (Headroom e Ombros)
UpsizeLeft="Margem Esquerda"
UpsizeLeft.Desc="Espaço adicional à esquerda da cabeça para evitar enquadramentos muito justos."
UpsizeRight="Margem Direita"
UpsizeRight.Desc="Espaço adicional à direita da cabeça."
UpsizeTop="Margem Superior (Headroom)"
UpsizeTop.Desc="Espaço livre acima da cabeça para não cortar cabelo, bonés ou chapéus."
UpsizeBottom="Margem Inferior (Pescoço e Ombros)"
UpsizeBottom.Desc="Espaço adicional abaixo do queixo para incluir o enquadramento do busto/ombros."

# Movimentação e Resposta (PID e Suavização)
TrackingResponse="Comportamento e Dinâmica do Movimento"
Profile="Perfil de Movimento"
Profile.Desc="Selecione a suavidade e a velocidade com que a câmera acompanha a movimentação da cabeça."
Profile.Smooth="Cinematográfico / Suave (Movimento lento e contínuo, ideal para bate-papo e podcasts)"
Profile.Balanced="Equilibrado (Padrão, movimentos naturais para streamers e criadores)"
Profile.Fast="Dinâmico / Rápido (Reação ágil a passos e caminhadas, ótimo para apresentações e aulas)"
Profile.Custom="Manual / Avançado (Permite calibrar os coeficientes PID matemáticos)"

TrackKp="Velocidade de Resposta (Kp)"
TrackKp.Desc="Determina a velocidade inicial de reação da câmera ao movimento. Valores muito altos podem causar oscilações."
TrackKi="Correção de Centralização (Ki)"
TrackKi.Desc="Termo integral. Corrige gradualmente pequenos desvios contínuos para manter a face perfeitamente alinhada."
TrackTd="Amortecimento de Movimento (Td)"
TrackTd.Desc="Termo derivativo. Amortece movimentos repentinos para evitar trancos ou paradas bruscas na câmera."
TrackLPF="Filtro de Ruído / Vibração (LPF)"
TrackLPF.Desc="Filtro passa-baixas para o movimento. Valores maiores amenizam tremores de alta frequência."
TrackLPFZ="Filtro de Ruído para o Zoom (LPF Z)"
TrackLPFZ.Desc="Filtro passa-baixas exclusivo para o zoom, evitando que a imagem fique pulsando para frente e para trás."
ZoomAttenuation="Atenuação do Zoom"
ZoomAttenuation.Desc="Suaviza as transições de aproximação/afastamento do zoom para serem mais graduais que o movimento de câmera."
Deadband="Zona Morta Anti-Tremor (X, Y, Z)"
Deadband.Desc="Ignora micromovimentos involuntários (respiração, pequenos acenos). Mantém a câmera imóvel enquanto você estiver sentado quieto."
NonlinearBand="Aceleração Progressiva (X, Y, Z)"
NonlinearBand.Desc="Cria uma saída suave da zona morta, evitando partidas repentinas quando você começa a se mexer."

# Opções de Detecção Facial
FaceDetectionOptions="Motor de Detecção Facial"
ScaleImage="Redução de Imagem para Detecção (Scale)"
ScaleImage.Desc="Reduz a resolução do vídeo antes de enviar para o detector, poupando CPU/GPU. Use 2 para 1080p, ou 1 para rostos distantes/pequenos."
DetectorEngine="Algoritmo de Detecção"
DetectorEngine.Desc="HOG roda leve na CPU. CNN utiliza rede neural, porém sem aceleração CUDA dedicada na compilação pode causar travamentos na CPU."
DlibHogModel="Arquivo do Modelo HOG"
DlibHogModel.Desc="Caminho do arquivo do detector frontal clássico (.dat)."
DlibCnnModel="Dlib CNN Model File"
DlibCnnModel.Desc="Caminho do modelo neural convolucional (.dat). Nota: Em builds de CPU pura este modelo é extremamente lento."
CropLeft="Área de Busca - Esquerda"
CropLeft.Desc="Ignora a área esquerda do vídeo durante a detecção (ótimo para desconsiderar pessoas ao fundo)."
CropRight="Área de Busca - Direita"
CropRight.Desc="Ignora a área direita do vídeo durante a detecção."
CropTop="Área de Busca - Superior"
CropTop.Desc="Ignora a parte superior do vídeo na detecção."
CropBottom="Área de Busca - Inferior"
CropBottom.Desc="Ignora a parte inferior do vídeo na detecção."
LandmarkDetection="Ativar Pontos de Referência Faciais (Landmarks)"
LandmarkDetection.Desc="Rastreia partes anatômicas da face (olhos, nariz, boca) para um enquadramento mais refinado e estável."
LandmarkData="Arquivo de Dados de Landmarks"
LandmarkData.Desc="Caminho para o modelo de formato facial (.dat de 5 ou 68 pontos)."
TrackingThEn="Ativar Limite de Confiança"
TrackingThEn.Desc="Interrompe o rastreamento automaticamente se o nível de confiança do alvo cair abaixo do limite."
TrackingThDb="Sensibilidade de Perda de Rastreamento (dB)"
TrackingThDb.Desc="Limite para declarar que o rosto foi perdido e reativar a busca pelo detector."

# Saída e Entrada
Output="Formato de Saída"
Aspect="Proporção da Imagem (Aspect Ratio)"
Aspect.Desc="Proporção desejada do vídeo final (ex: 16:9 widescreen, 9:16 vertical para Shorts/TikTok, ou mesmo que a fonte)."
SameAsSource="Mesmo que a fonte"
Source="Fonte de Vídeo"
Source.Desc="Selecione qual fonte de vídeo será recortada e enquadrada pelo Face Tracker."

# Automação e Depuração
Automation="Automação"
InactiveReset="Resetar quando inativo"
InactiveReset.Desc="Reseta a posição e pausa o rastreamento quando a fonte ou cena não estiver sendo exibida no programa ao vivo."
Debugging="Diagnóstico e Teste Visual"
DebugFaces="Exibir Caixas de Detecção Facial"
DebugFaces.Desc="Desenha caixas coloridas ao redor dos rostos detectados e rastreados (oculto automaticamente na saída do programa)."
DebugNoTrack="Modo de Pré-visualização sem Corte"
DebugNoTrack.Desc="Mostra a imagem completa da câmera com um retângulo amarelo indicando onde o enquadramento seria cortado."
DebugAlwaysShow="Sempre Exibir Informações de Depuração"
DebugAlwaysShow.Desc="Mantém as caixas de depuração visíveis mesmo no ar (ótimo para apresentações e demonstrações)."

# Configurações Específicas do Face Tracker PTZ
PtzSmoothness="Suavidade de Aceleração PTZ (Rampa)"
PtzSmoothness.Desc="Controla a rampa de aceleração e desaceleração física dos motores da câmera. Valores menores resultam em movimentos lentos e sedosos (estilo transmissão de estúdio), e valores maiores proporcionam aceleração mais direta."
TrackKpX="Ganho Kp Pan (Horizontal)"
TrackKpY="Ganho Kp Tilt (Vertical)"
TrackKpZ="Ganho Kp Zoom"
TrackKiX="Ganho Ki Pan"
TrackKiY="Ganho Ki Tilt"
TrackKiZ="Ganho Ki Zoom"
TrackTdX="Tempo Derivativo Td Pan"
TrackTdY="Tempo Derivativo Td Tilt"
TrackTdZ="Tempo Derivativo Td Zoom"
TrackLPFXY="Filtro LPF para Td (Pan/Tilt)"
DeadbandX="Zona Morta Pan (%)"
DeadbandY="Zona Morta Tilt (%)"
DeadbandZ="Zona Morta Zoom (%)"
NonlinearBandX="Zona Não-Linear Pan (%)"
NonlinearBandY="Zona Não-Linear Tilt (%)"
NonlinearBandZ="Zona Não-Linear Zoom (%)"
AttenuationTime="Tempo de Atenuação após Perda do Rosto"
AttenuationTime.Desc="Tempo em segundos para a velocidade da câmera desacelerar suavemente a zero caso o rosto do apresentador saia de cena."

# Gamepad (Xbox / PS5)
Gamepad.Group="Controle por Gamepad (Xbox / PS5)"
Gamepad.Enabled="Ativar Controle por Gamepad"
Gamepad.Enabled.Desc="Permite controlar os movimentos Pan/Tilt/Zoom da câmera em tempo real usando os sticks analógicos e gatilhos de um controle de Xbox, PS5 ou compatível via USB/Bluetooth."
Gamepad.Deadzone="Zona Morta do Analógico (%)"
Gamepad.Deadzone.Desc="Ignora pequenos desvios físicos no stick analógico do controle para evitar drift involuntário da câmera quando você não está tocando no analógico."
Gamepad.Sensitivity="Sensibilidade do Analógico"
Gamepad.Sensitivity.Desc="Multiplicador de velocidade para os controles analógicos do gamepad. Curva exponencial aplicada: pequenos toques movem a câmera milimetricamente, e empurrar até o fim alcança a velocidade total."

# Comportamento ao Perder o Rosto
FaceLost.Group="Comportamento ao Perder o Rosto"
FaceLost.TimeoutPreset="Tempo de Espera para Chamar Preset"
FaceLost.TimeoutPreset.Desc="Tempo em segundos que a câmera aguarda antes de retornar automaticamente para uma posição pré-programada (Preset) caso o rosto desapareça."
FaceLost.PresetIndex="Número do Preset de Retorno (-1 desativa)"
FaceLost.PresetIndex.Desc="O número do preset salvo na câmera para o qual ela deve se mover automaticamente ao perder o rosto (ex: Preset 1 para enquadramento geral do estúdio)."
FaceLost.TimeoutZoomout="Tempo de Espera para Abrir Zoom"
FaceLost.TimeoutZoomout.Desc="Abre o enquadramento (Zoom Out) após este tempo caso a pessoa saia do campo de visão, facilitando encontrá-la novamente."

# Conexão PTZ
PTZ.Type="Tipo de Câmera / Protocolo PTZ"
PTZ.Type.Desc="Selecione o método de comunicação com a sua câmera PTZ física."
PTZ.Type.None="Nenhum (Apenas Teste / Simulação)"
PTZ.Type.Obsptz="Via Plugin PTZ Controls (obs-ptz)"
PTZ.Type.ViscaTCP="VISCA por Rede IP (TCP)"
PTZ.InvertPan="Inverter Movimento Pan (Horizontal)"
PTZ.InvertPan.Desc="Inverte a direção horizontal da câmera."
PTZ.InvertTilt="Inverter Movimento Tilt (Vertical)"
PTZ.InvertTilt.Desc="Inverte a direção vertical da câmera."
PTZ.InvertZoom="Inverter Movimento de Zoom"
PTZ.InvertZoom.Desc="Inverte a aproximação/afastamento do zoom da câmera."

